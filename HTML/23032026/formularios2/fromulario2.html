<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario 1 Basico</title>
    <link rel="stylesheet" href="estilos/estilo_pagina.css">
    <style>
        @import url(estilos/estilo_parrafos.css);

        #centro {
            width: 60%;
            margin: auto;
        }
        textarea{
            resize: none;
        }
        #btn-enivar{
            float: left;
        }
        #btn-cancel{
            float: right;

        }
        label{
            -font-weight: bold;
        }
        fieldset{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 5px;
            padding: 10px;
            border: 5px double rgb(66, 134, 27);
            
            box-shadow: 3px 3px gray;
            background-color: bisque;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div id="contenedor">

        <header>
            <h1>Formularios 1</h1>
        </header>
        <main>
            <div id="centro">
                <div id="div_form">
                    <h1>Petición de información</h1>
                    <form action="" id="form1" enctype="multipart/form-data">
                        <fieldset>
                            <br>
                            <legend>Formulario </legend>
                            

                            <label for="nombre">
                                Nombre:
                            </label>
                            <input type="text" id="nombre" name="nombre" form="form1" size="50" placeholder="Escriba aquí su Nombre"
                                required>

                            <br>

                            <label for="apellido">
                                Pais:
                            </label>
                            <input type="text" id="apellido" name="apellido" form="form1" size="25"
                                placeholder="Escriba aquí su Apellidos" required>

                            <br>

                            <label for="email">
                                Email:
                            </label>
                            <input type="text" id="email" name="email" form="form1" size="30" placeholder="Escriba aquí su email"
                                required>

                            <br>
                            <label for="consulta">
                                Consulta:
                            </label>
                            <textarea type="text" id="consulta" name="consulta" form="form1" cols="50" rows="3" placeholder="Escriba aquí su Motivo de Consulta"></textarea>

                           
                           

                        
                        <label >
                            imagenes:  
                            <input type ="file" name = "archivos[]" multiple accept ="image/*"> 
                            <input type="image" src = "playa.jpg" >
                        </label>
                        

                         <br>
                            
                        <input id="btn-enivar" class="boton" type="submit" form="form1" value="Enviar">                      
                        

                        <button id="btn-cancel" class="boton" type="reset" form="form1"> Pulse aquí para cancelar - Esto borrará los datos</button>
                        </fieldset>
                        

                        <!-- <input id="btn-enivar" class="boton" type="submit" value="¡Me apunto!">  
                        <input id="btn-cancel" class="boton" type="reset" value="Cancelado"> -->
                        

                    </form>
                </div>

            </div>
        </main>
        <footer>
            <h6>Angel Gonzalez formularos </h6>

        </footer>


    </div>

</body>

</html>
