<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario 3</title>
    <link rel="stylesheet" href="estilos/estilo_pagina.css">
    <style>
        @import url(estilos/estilo_parrafos.css);

        #centro {
            width: 60%;
            margin: auto;
        }

        textarea {
            resize: none;
        }

        #btn-enivar {
            float: left;
        }

        #btn-cancel {
            float: right;

        }

        label {
            -font-weight: bold;
        }

        fieldset {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 5px;
            padding: 10px;
            border: 5px double rgb(66, 134, 27);

            box-shadow: 3px 3px gray;
            background-color: bisque;
            font-weight: bold;
        }

        #dcampo label {
            width: 20%;
            float: left;
            
        }
    </style>
</head>

<body>
    <div id="contenedor">

        <header>
            <h1>Formulario 3</h1>
        </header>
        <main>
            <div id="centro">
                <div id="div_form">
                    <h1>Sección de Novedades</h1>
                    <form action="" id="form1" enctype="">
                        <fieldset>
                            <br>
                            <legend>Formulario de registro</legend>

                            <div id="dcampo">

                                <label for="nombre">
                                    Nombre:
                                </label>
                                <input type="text" id="nombre" name="nombre" form="form1" size="50"
                                    placeholder="Escriba aquí su Nombre" required>
                            </div>
                            <br>
                            <div id="dcampo">

                                <label for="apellidos">
                                    Apellidos:
                                </label>
                                <input type="text" id="apellidos" name="apellidos" form="form1" size="25"
                                    placeholder="Escriba aquí sus Apellidos" required>
                            </div>
                            <br>
                            <div id="dcampo">

                                <label for="sexo">
                                    Sexo:
                                </label>

                                <input type="radio" name="sexo" value="Soltero"> Femenino
                                <input type="radio" name="sexo" value="Casado"> Masculino
                            </div>
                            <br>
                            <div id="dcampo">
                                <label for="correo">
                                    <!-- Correo Electronico: -->
                                     Email:
                                </label>
                                <input type="text" id="correo" name="correo" size="40"
                                    placeholder="Escriba aquí su correo" required>
                            </div>
                                <br>
                            <div id="dcampo">
                                <label for="poblacion">
                                    Poblacion:
                                </label>
                                <select>
                                    <optgroup label="Caracas">
                                        <option>Miranda</option>
                                        <option>Atillo</option>
                                    </optgroup>
                                    <optgroup label="Portuguesa">
                                        <option>Acarigua</option>
                                    </optgroup>
                                    <optgroup label="Cúcuta">
                                        <option>San Antonio</option>
                                    </optgroup>
                                </select>
                            </div>

                            <br>
                            <div id="dcampo">
                                <label for="consulta">
                                    Consulta:
                                </label>
                                <textarea type="text" id="consulta" name="consulta" form="form1" cols="50" rows="3"
                                    placeholder="Escriba aquí su Motivo de Consulta"></textarea>
                            
                            </div>

                                <br>
                            <div id="dcampo">
                                <label for="archivos[]">
                                    Imagenes:
                                    
                                </label>
                                <input type="file" name="archivos[]" multiple accept="image/*">

                            </div>

                            <br>
                            <p>
                            <input id="btn-enivar" class="boton" type="submit" form="form1" value="Enviar">
                            <input type="image" src="mas.ico" alt="enviar" >

                            <button id="btn-cancel" class="boton" type="reset" form="form1"> Pulse aquí para cancelar -
                                Esto borrará los datos</button>
                            </p>
                        </fieldset>


                        <!-- <input id="btn-enivar" class="boton" type="submit" value="¡Me apunto!">  
                        <input id="btn-cancel" class="boton" type="reset" value="Cancelado"> -->


                    </form>
                </div>

            </div>
        </main>
        <footer>
            <h6>Angel Gonzalez formularos </h6>

        </footer>


    </div>

</body>

</html>
