<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario 1 Basico</title>
    <link rel="stylesheet" href="estilos/estilo_pagina.css">
    <style>
        @import url(estilos/estilo_parrafos.css);
        #centro{
            width: 60%;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="contenedor">

        <header>
            <h1>Formularios 1</h1>
        </header>
        <main>
            <div id="centro">
                <div id="div_form">
                    <h1>Inscripción en el concurso Saber y Ganar</h1>
                    <form action="" id="form1">
                        <fieldset>

                            <label for="nombre">
                                Nombre:
                            </label>
                            <input type="text" id="nombre" name="nombre" size="55" placeholder="Escriba aquí su Nombre"
                                required> <br>

                            <label for="apellido">
                                Apellidos:
                            </label>
                            <input type="text" id="apellido" name="apellido" size="55"
                                placeholder="Escriba aquí su Apellidos" required> <br>

                            <label for="Email">
                                Email:
                            </label>
                            <input type="text" id="Email" name="Email" size="40" placeholder="Escriba aquí su email"
                                required> <br>

                            <label for="telefono">
                                Teléfono:
                            </label>
                            <input type="text" id="telefono" name="telefono" size="11" placeholder="+34 6001234567"
                                required> <br>

                        </fieldset>

                        <input type="submit" value="¡Me apunto!">  
                        <input type="reset" value="Cancelao"><br>

                    </form>
                </div>

            </div>
        </main>
        <footer>
            <h6>Angel Gonzalez formularos </h6>

        </footer>


    </div>

</body>

</html>
