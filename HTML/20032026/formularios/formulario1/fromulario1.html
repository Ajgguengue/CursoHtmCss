<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fromulario 1 Basico</title>
    <link rel="stylesheet" href="estilos/estilo_pagina.css">
    <style>
        @import url(estilos/estilo_parrafos.css);

        #centro {
            width: 60%;
            margin: auto;
        }
    </style>
</head>

<body>
    <div id="contenedor">

        <header>
            <h1>Formularios 1</h1>
        </header>
        <main>
            <div id="centro">
                <div id="div_form">
                    <h1>Inscripción en el concurso Saber y Ganar</h1>
                    <form action="" id="form1">
                        <fieldset>

                            <label for="nombre">
                                Nombre:
                            </label>
                            <input type="text" id="nombre" name="nombre" size="55" placeholder="Escriba aquí su Nombre"
                                required>

                            <br>

                            <label for="apellido">
                                Apellidos:
                            </label>
                            <input type="text" id="apellido" name="apellido" size="55"
                                placeholder="Escriba aquí su Apellidos" required>

                            <br>

                            <label for="email">
                                Email:
                            </label>
                            <input type="text" id="email" name="email" size="40" placeholder="Escriba aquí su email"
                                required>

                            <br>

                            <label> <!--label sin for="telefono"-->
                                Teléfono:
                                <input type="text" id="telefono" name="telefono" size="11" placeholder="+34 6001234567"
                                    required>
                            </label>

                            <br>

                        </fieldset>

                        <input id="btn-enivar" class="boton" type="submit" value="¡Me apunto!">  
                        <input id="btn-cancel" class="boton" type="reset" value="Cancelado"><br>

                    </form>
                </div>

            </div>
        </main>
        <footer>
            <h6>Angel Gonzalez formularos </h6>

        </footer>


    </div>

</body>

</html>
