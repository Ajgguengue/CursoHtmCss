

<!DOCTYPE html>
<html>

	<head>
	
		<meta charset="utf-8"/>
		<title>Mapa de imágenes</title>
		
	</head>
	<body >
		<img src="imagenes/playa.png" usemap="#playa" alt="Imagen de una playa">
		<map name="playa">
			<area shape="circle" coords="475,122,50" href="https://es.wikipedia.org/wiki/Nube" alt="Imagen de nube" title ="Pulsa aquí si quieres saber que es una nube">
			<area shape="poly" coords="0,153,395,245,0,238,0,153" href="https://es.wikipedia.org/wiki/Arecaceae" alt="Imagen de palmeras">
			<area shape="rect" coords="0,237,147,303" href ="imagenes/Licencias Creative Commons.png" alt="Licencias CC">
			<area shape="default" href ="imagenes/playa2.jpg" alt ="Otra playa">
		</map>		
		
				
	
	</body>
 </html>
