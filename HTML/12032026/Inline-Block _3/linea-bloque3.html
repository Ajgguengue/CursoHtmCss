<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline-Block 3</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            
            /* font-size: 12px; */
        }
        body{
            margin: auto;
            width: 750px;
        }
        header{
            margin: 5px;
            border: 1px solid salmon;
            background-color: aquamarine;
            
        }
        main{
            margin: 5px;
            border: 1px solid salmon;
            
        }
        section{
            margin: 5px;
            border: 1px solid rgb(236, 160, 151);
            height: 450px;
            width: 231px;
            display: inline-block;
            font-size: 9px;
            border-radius:5px 15px 15px 15px;
            
        }
        #s1{
            /* border-color:salmon blue yellow green red; */
            border-color:salmon  red salmon salmon  ;
            background-color: rgb(232, 245, 201);
        }
        #s2{
            border-color:salmon red blue salmon  ;
            background-color: rgb(181, 224, 78);
        }
        #s3{
            border-color:salmon salmon blue yellow  ;
            background-color: rgb(143, 192, 27);
        }

        footer{
            margin: 5px;
            padding: 5px;
            border: 1px solid salmon;

        }
        h1, h2, h6 {
            text-align: center;
            margin: 5px;
            font-family: Verdana, 'sans-serif';
        }


    </style>
</head>
<body>
    <header>
        <h1>linea y bloque 3</h1>
    </header>
    <main>
        <section id="s1"><h2>Seccion 1</h2></section>
        <section id="s2"><h2>Seccion 2</h2></section>
        <section id="s3"><h2>Seccion 3</h2></section>
    </main>
    <footer>
        <h6>angel gonzalez linea y bloque 3</h6>
    </footer>
    
</body>
</html>
