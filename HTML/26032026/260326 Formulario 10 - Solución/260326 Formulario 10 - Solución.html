<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
		<title>Formulario 10 | Validación Datos</title>		
		<link href ="css/formulario10.css" rel ="stylesheet">
	
	</head>

	<body>


	<div id="div0">
	
		<form action="" method="post" name="Formulario 10">
		
			<fieldset>
			<h3>Datos del cliente.</h3>
			<div>
				<p>
					<label>Código de Cliente:</label><input type="text" pattern="[A-Z]{2}[0-9]{2}" name="cod" required>
				</p>
				
				<p>
					<label>Nombre:</label><input type="text" name="nombre" size="20"maxlength="50" required>
				</p>
			</div>
			
			<div>
				<p>
					<label>Apellidos:</label><input type="text" name="apellidos" maxlength="50" required>
				</p>
			</div>
			<div>
				<p>
					<label>Contraseña:</label><input type="password" name="contraseña" minlength ="6" maxlength="24" required >
				</p>
			</div>
			<div>
				<p>
					<label>Edad:</label><input type="number" min ="18" max="120" name="edad" id="edad" required>
				</p>
			</div>
				
			<div>
				<p>
					<label>Teléfono:</label><input type="tel" name="telefono" pattern="[0-9]{9}" required>
				</p>
			</div>
			
			<div>
				<p>
					<label>Correo electrónico:</label><input type="email" name="correo-e"  maxlength="50" required>
				</p>
			</div>
			<div>
				<p>
					<label>Fecha de Alta:</label><input type="date" max="2023-10-27" name="alta" id="fecha" required>
				</p>
			</div>
			<div>
				<p>
					<label>Comentarios:</label><textarea rows="2" cols="18" name="coment" required></textarea>
				</p>
			</div>
			
			</fieldset>
			<fieldset>
			<div>
				<p id = "pboton"><input type="submit" id="enviar" value="Confirmar Pedido"></p>
			</div>
			</fieldset>
			
		</div>		
		</form>
		
	</div>
	</body>
 </html>
