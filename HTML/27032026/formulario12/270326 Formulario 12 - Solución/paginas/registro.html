<!DOCTYPE html>

<html>
    <head>
	
        <meta charset="utf-8">
		<title>Formulario 12 | Registro Datos Personales</title>		
		<link href ="../css/registro.css" rel ="stylesheet">
		
	</head>

	<body>
	
	<div id="contenedor">
	
		<form action="" method="post" name="for12r" id="f12r">
		
			
			<h3>Datos del Usuario / Cliente.</h3>
			<div id="d0">
				
				<fieldset>
				<p class="borde">
					<label>Usuario / Login:</label><input type="text" size="40" maxlength="50" name="log" required>
				</p>
				<p class="borde">
					<label>Contraseña:</label><input type="password" size="40" min="8" name="pass1" required>
				</p>
				<p class="borde">
					<label>Confirmar Contraseña:</label><input type="password" min="8" size="40" name="pass2" required>
				</p>
				</fieldset>
				
				<fieldset>
				<p class="borde">
					<label>NIF / DNI:</label><input type="text" pattern="[0-9]{8}[A-Z]{1}" name="cod" required>
				</p>
				
				<p class="borde">
					<label>Nombre:</label><input type="text" name="nombre" maxlength="50" required>
				</p>
			
				<p class="borde">
					<label>Apellidos:</label><input type="text" name="apellidos" maxlength="50" required>
				</p>
			
				<div id="d1">
					<p class="borde" id="cp">
						<label>Codigo Postal:</label><input type="text" name="codp" size="5" pattern="[0-9]{5}" required >
					</p>
				
					<p class="borde" id="ciudad">
						<label>Ciudad:</label><input type="text" required>
					</p>
				
				</div>
			
				<div id="d2">
					<p class="borde" id="calle">
						<label>Calle:</label><input type="text" name="cal" required >
					</p>
				
					<p class="borde" id="numero">
						<label>Número:</label><input type="text" name="num" size="3" pattern="[0-9]{1-3}" required>
					</p>
				
				</div>
			
				<div id="d3">
					<p class="borde" id="tel">
						<label>Teléfono:</label><input type="tel" size="9" name="telefono" pattern="[0-9]{9}" required>
					</p>
				
					<p class="borde" id="correo">
						<label>Correo electrónico:</label><input type="email" name="correo-e" size="40"  maxlength="40" required>
					</p>
				</div>
						
			</fieldset>
			
			<fieldset>
				<div id="navegar">
					<a href="../index.html" id="atras">Atrás</a>
					<a href="#" id="adelante">Continuar</a>
				</div>
			</fieldset>
			
			
		</div>
			
		</form>
	</div>
	</body>
 </html>
