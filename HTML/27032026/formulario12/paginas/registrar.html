<body>

    <div id="centro">
        <h3>Datos del Usuario / Cliente</h3>
        <form action="" name="login" method="post">
            <fieldset>
                <div id="d_campo" class="campos">
                    <label for="usuario">
                        Usuario / Login:
                    </label>
                    <input type="text" name="usuario" id="usuario" required>
                </div>
                <div id="d_campo" class="campos">
                    <label for="contrasena">
                        Contraseña: 
                    </label>
                    <input type="password" name="contrasena" id="contrasena" required>
                </div>
                <div id="d_campo" class="campos">
                    <label for="contrasena">
                        Confirmar Contraseña: 
                    </label>
                    <input type="password" name="re_contrasena" id="re_contrasena" required>
                </div>
            </fieldset>
            <fieldset>
                <div id="d_campo" class="campos">
                    <label for="dni">
                        DNI / NIF:
                    </label>
                    <input type="text" name="dni" id="dni" pattern="[0-9]{8}[A-Z]{1}" required>
                </div>
                <div id="d_campo" class="campos">
                    <label for="nombres">
                        Nombres: 
                    </label>
                    <input type="text" name="nombres" id="nombres" maxlength="50" required>
                </div>
                <div id="d_campo" class="campos">
                    <label for="apellido">
                        Apellidos: 
                    </label>
                    <input type="text" name="apellido" id="apellido" maxlength="50" required>
                </div>
                
                <div id="dos">
                    <div id="d_campo_corto_postal" class="campos">
                        <label for="postal" id="l_postal">
                            Codigo Postal: 
                        </label>
                        <!-- <input type="number"  name="postal" id="postal" size="5" max="3500"  required> -->                    
                        <input type="text" pattern ="[0-9]{5}" size="5" id="postal">
                    </div>

                   <div id="d_campo_corto_ciudad" class="campos">
                        <label for="ciudad" id="l_ciudad">
                            Ciudad:             
                        </label>
                        <input type="text"  name="ciudad" id="ciudad" size="25"  required>
                    </div>
                </div>
                <div id="dos">
                    <div id="d_campo_corto_calle" class="campos">
                        <label for="calle" id="l_calle">
                            Calle: 
                        </label>
  
                        <input type="text"  size="25" id="calle">
                    </div>
                
                   <div id="d_campo_corto_numero" class="campos">
                        <label for="numero" id="l_numero">
                            Número: 
                        </label>
                        <input type="text" name="numero" id="numero" pattern="\d{1,4}" size="4"required>
                    </div>
                </div>

                <div id="dos">
                    <div id="d_campo_corto_telefono" class="campos">
                        <label for="telefono" id="l_telefono">
                            Telefono: 
                        </label>
                        <input type="tel" id="telefono" size="10" pattern="[0-9]{9}">
                    </div>
                
                   <div id="d_campo_corto_correo" class="campos">
                        <label for="correo" id="l_correo">
                            Correo Electronico: 
                        </label>
                        <input type="email"  name="correo" id="correo" size="35" required>
                    </div>
                </div>

            </fieldset>
            <fieldset>



                
                <div id="d_boton">                    
                    <a href="../index.html" id="atras">Atrás</a>
                    <a href="#" id="continuar">Continuar</a>
                </div>

            </fieldset>
        </form>
