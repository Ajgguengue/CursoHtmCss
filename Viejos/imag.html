<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria 1</title>
    <style>
        h1{
            font-size: 30px;
        }
        #d_centrar {
            background-color: rgb(16, 103, 202);
            border: 1px solid yellow;
            margin: 5px;
        }
        table{
            margin: 15px auto;
        }
        header{
            margin: 5px;
            height: 100px;
            border: 2px dashed rgb(125,25,54);
        }
        main{
            margin: 5px;
            border: 2px dashed rgb(125,25,54);
        }
        footer{
            margin: 5px;
            height: 150px;
            border: 2px dashed rgb(125,25,54);
            background-color: rgb(15, 124, 124);
        }
        td{
            padding: 5px;
        }

    </style>
</head>
<body bgcolor="#146789">
    <header>

        <h1 style="visibility: collapse;">cabecera</h1>

    <main>
        <div id="d_centrar">
            <table border="1" align="center">
                <tr style="background-color: azure;">
                    <th colspan="3">
                        <h1 style="font-weight: bold; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; color:#32ee32 ">Galeria de Imagenes</h1>
                    </th>
                </tr>
                <tr>
                    <td><img src="/imagenes/minerales/fotos/afghanita.jpg" alt="Afghanita" width="220px" height="220px"></td>
                    <td><img src="/imagenes/minerales/fotos/agata.jpg" alt="Agata" width="220px" height="220px"></td>
                    <td><img src="/imagenes/minerales/fotos/amatista.webp" alt="Amatista" width="220px" height="220px"></td>

                    <td><img src="/imagenes/minerales/fotos/cuarzo_rosa.jpg" alt="Cuarzo Rosa" width="220px" height="220px"></td>
                </tr>
                <tr>
                    <td><img src="/imagenes/minerales/fotos/fluorita.jpg" alt="Fluorita" width="220px" height="220px"></td>
                    <td><img src="/imagenes/minerales/fotos/pirita.webp" alt="Pirita" width="220px" height="220px"></td>
                    <td><img src="/imagenes/minerales/fotos/yeso-selenita.jpg" alt="Yeso-Selenita" width="220px" height="220px"></td>
                </tr>
            </table>

        </div>
