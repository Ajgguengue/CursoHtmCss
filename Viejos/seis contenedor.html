<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenedores DIV anidados</title>
</head>
<body>

    <div style="border: 3px solid black; margin: 2px; width: 600px; margin: auto; padding: 10px;">

        <div style="border: 3px solid rgb(255, 0, 0); margin: 2px;  padding: 2px;">
            <h1 style="text-align: center; font-family: 'Franklin Gothic Medium'; font-size: 22pt; background-color: brown;">DIV 1</h1>
        </div>
        <div style="border: 3px solid rgb(82, 243, 8); margin: 2px; padding: 2px;">
            <div style="border: 3px solid rgb(224, 221, 42); margin: 2px;   ">
                <h2 style="text-align: center; font-family: 'comic sans ms'; font-size: 22pt; background-color: aquamarine;">DIV 2</h2>
            </div>
            <div style="border: 3px solid rgb(33, 52, 216); margin: 2px;  ">
                <h2 style="text-align: right; font-family: 'comic sans ms'; font-size: 22pt; background-color: blueviolet;" >DIV 3</h2>
            </div>
        </div>

    </div>
    
</body>
</html>
